# Grafana Service for Development
# This provides Grafana with API server aggregation support
# Database is provided separately by the mysql extension
# Used by various development environments

services:
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-enterprise}:${GRAFANA_VERSION:-latest}
    container_name: 'grafana'
    user: root
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_DEFAULT_APP_MODE: development
      # Authentication settings
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: true

      # Server settings
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}

      # NOTE: Kubernetes feature toggles removed from base config
      # Projects needing k3s integration should add via compose_overrides():
      #   kubernetesDashboards,kubernetesDashboardsAPI,grafanaAPIServerEnsureKubectlAccess,kubernetesAggregator
      # These require k3s certificates which are only available when k3s-apiserver is present

      # Logging
      GF_LOG_LEVEL: info
      GF_LOG_FILTERS: grafana-apiserver:warn,dashboards-k8s-client:warn

    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana-debug:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    container_name: grafana-debug
    user: root
    depends_on:
      - grafana
    volumes:
      - grafana-data:/var/lib/grafana:ro
      # Note: Plugin volumes and provisioning files will be added by register_plugin()
    command:
      - sh
      - -c
      - |
        echo "Grafana Debug Container Started"
        echo "Use 'docker exec -it grafana-debug sh' to inspect volumes"
        echo ""
        echo "Useful commands:"
        echo "  ls -laR /var/lib/grafana/plugins/"
        echo "  ls -laR /etc/grafana/provisioning/plugins/"
        echo "  cat /etc/grafana/provisioning/plugins/*.yaml"
        echo ""
        tail -f /dev/null
    restart: unless-stopped
    # profiles:
    #   - debug

volumes:
  grafana-data:
