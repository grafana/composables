# Grafana Service for Development
# This provides Grafana with API server aggregation support
# Database is provided separately by the mysql extension
# Used by various development environments

services:
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: 'grafana'
    user: root
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_DEFAULT_APP_MODE: development
      # Authentication settings
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED: true
      
      # Server settings
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      
      # Feature toggles for service model integration
      GF_FEATURE_TOGGLES_ENABLE: kubernetesDashboards,kubernetesDashboardsAPI,grafanaAPIServerEnsureKubectlAccess,kubernetesAggregator
      
      # Logging
      GF_LOG_LEVEL: info
      GF_LOG_FILTERS: grafana-apiserver:info,dashboards-k8s-client:warn
      
      # Plugin settings
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-servicemodel-plugin

    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
