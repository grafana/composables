; Sample ini for register_ini_file() tests
app_mode = development

[plugins]
preinstall_auto_update = false
forward_host_env_vars = grafana-assistant-app

# hash comment
[navigation.app_standalone_pages]
"/connections/private-data-source-connections" = "connections"

[id_forwarding]
token = $__file{/run/auth/grafana-id-signer/token}
sign_url = http://authapi:4200/v1/sign-id-token?a=b
