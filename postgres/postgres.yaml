# PostgreSQL Database Service for Development
# Provides PostgreSQL backend for Grafana and other services
# Used by various development environments

services:
  pgdb:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: grafana
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d grafana']
      timeout: 1s
      retries: 10

volumes:
  postgres-data:
