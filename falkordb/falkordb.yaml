# FalkorDB Graph Database for Development
# Provides a Redis-protocol-compatible graph database

services:
  falkordb:
    image: falkordb/falkordb:v4.16.7
    ports:
      - '${FALKORDB_PORT:-6381}:6379'
      - '${FALKORDB_WEB_PORT:-3001}:3000'
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
