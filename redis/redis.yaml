# Redis Cache Service for Development
# Provides Redis cache for OnCall and other services
# Used by OnCall backend for caching and Celery broker

services:
  redis:
    image: redis:7.4@sha256:d3be87a1060455213a204d2b0a7f04d45d19a16a98e85b3c37b7c33b5f0c489e
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis-data:
