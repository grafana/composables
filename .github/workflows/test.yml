name: Test Composables

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: '${{ github.ref_name }}-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: Test all composables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Install Tilt
        env:
          TILT_VERSION: "0.37.3"
          TILT_CHECKSUM: "e90bc6cf70882bc7579d8174a27cab2de0284612ec7339e4b32f669cd5de4e5c"
        run: |
          curl -fsSL -o tilt.tar.gz "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz"
          echo "${TILT_CHECKSUM}  tilt.tar.gz" | sha256sum --check --strict
          tar xzf tilt.tar.gz tilt
          sudo cp tilt /usr/local/bin/tilt
          rm -f tilt tilt.tar.gz
          tilt verify-install

      - name: Load environment variables
        run: |
          if [ -f .env.docker-compose ]; then
            # Filter out comments and empty lines, handle inline comments
            grep -v '^#' .env.docker-compose | grep -v '^$' | sed 's/#.*//' | sed 's/[[:space:]]*$//' >> $GITHUB_ENV
          fi

      - name: Run tests
        run: make test
