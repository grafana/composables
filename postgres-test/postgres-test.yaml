services:
  postgres-test:
    image: postgres:latest
    container_name: grafana-assistant-postgres
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: testdb
    volumes:
      - postgres-test-data:/var/lib/postgresql
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres-test-data:
