services:
  mssql-test:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grafana-assistant-mssql-test
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: 'MyStrongP@ssw0rd123!'
      MSSQL_PID: Developer
    volumes:
      - mssql-test-data:/var/opt/mssql
    ports:
      - '${MSSQL_TEST_PORT:-1433}:1433'
    healthcheck:
      test:
        ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "MyStrongP@ssw0rd123!" -No -Q "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3g
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  mssql-test-data:
