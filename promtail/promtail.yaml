services:
  promtail:
    image: grafana/promtail:3.6.10@sha256:2a0f5e3e160ee5d549c585f6cc4f4e1c566ff783324a424bd75bc16503fc660e
    # NOTE: These volume mounts are Docker-specific and need adjustment for Podman:
    # - Docker: /var/lib/docker/containers and /var/run/docker.sock
    # - Podman: /run/podman/podman.sock (logs accessed differently)
    # Uncomment and adjust based on your container runtime:
    # volumes:
    #   - /var/lib/docker/containers:/var/lib/docker/containers:ro
    #   - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    healthcheck:
      # Use bash /dev/tcp for healthcheck (wget removed due to CVE-2024-38428)
      # See: https://github.com/grafana/loki/pull/15101
      test: ['CMD-SHELL', 'timeout 1 bash -c "</dev/tcp/127.0.0.1/9080" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes: {}
