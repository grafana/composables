services:
  promtail:
    image: grafana/promtail:latest
    # NOTE: These volume mounts are Docker-specific and need adjustment for Podman:
    # - Docker: /var/lib/docker/containers and /var/run/docker.sock
    # - Podman: /run/podman/podman.sock (logs accessed differently)
    # Uncomment and adjust based on your container runtime:
    # volumes:
    #   - /var/lib/docker/containers:/var/lib/docker/containers:ro
    #   - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes: {}
