services:
  renderer:
    image: grafana/grafana-image-renderer:latest
    ports:
      - '${RENDERER_PORT:-8081}:8081'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8081/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes: {}
