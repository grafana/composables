services:
  mysql-test:
    image: mysql:latest
    container_name: grafana-assistant-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
    volumes:
      - mysql-test-data:/var/lib/mysql
    ports:
      - '${MYSQL_TEST_PORT:-3307}:3306'  # Different port to avoid conflict with main db
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  mysql-test-data:
