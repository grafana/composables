services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - '${JAEGER_UDP_PORT:-6831}:6831/udp'
      - '${JAEGER_OTLP_PORT:-4317}:4317'    # OTLP
      - '${JAEGER_PROMETHEUS_PORT:-5778}:5778'
      - '${JAEGER_UI_PORT:-14268}:14268'
      - '${JAEGER_OTLP_PORT:-14250}:14250'
      - '${JAEGER_UI_PORT:-16686}:16686'  # UI
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.5'
          memory: 64M
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:14269/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes: {}
