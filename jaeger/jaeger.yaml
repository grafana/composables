services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - '6831:6831/udp'
      - '4317:4317'    # OTLP
      - '5778:5778'
      - '14268:14268'
      - '14250:14250'
      - '16686:16686'  # UI
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.5'
          memory: 64M

volumes: {}
