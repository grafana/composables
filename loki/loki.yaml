services:
  loki:
    # Build custom image with healthcheck support (extends grafana/loki:latest)
    # The official loki image uses distroless base without curl/wget/sh
    # Custom Dockerfile adds static httpcheck binary for healthchecks
    build:
      context: .
      dockerfile: Dockerfile
    image: loki-with-healthcheck:latest
    ports:
      - '${LOKI_HTTP_PORT:-3100}:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    # Healthcheck is defined in Dockerfile using static httpcheck binary

volumes:
  loki-data:
