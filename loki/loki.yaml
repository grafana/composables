services:
  loki:
    image: grafana/loki:latest
    ports:
      - '${LOKI_HTTP_PORT:-3100}:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    # Healthcheck disabled - minimal loki image doesn't include curl/wget/sh
    # healthcheck:
    #   test: ['CMD-SHELL', 'curl -f http://localhost:3100/ready || exit 1']
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

volumes:
  loki-data:
