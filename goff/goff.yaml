# Go Feature Flag Server for Development
# Provides feature flag evaluation via OFREP protocol
#
# Flag files and config are dynamically generated by process_accumulated_modifications().
# Use register_flags() and register_retriever() to configure sources.

services:
  goff:
    image: gofeatureflag/go-feature-flag:v1.52.1@sha256:c992b400a0a1611dae3adf4911469393d85f60d58188ee647d688e369dd2170c
    command: /go-feature-flag --config /config/config.yaml
    ports:
      - '${GOFF_PORT:-1031}:1031'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1031/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    configs:
      - source: goff_config
        target: /config/config.yaml

configs:
  goff_config:
    content: |
      logLevel: info
      logFormat: logfmt
      listen: 1031
      pollingInterval: 5000
      evaluationContextEnrichment:
        cluster: localdev
