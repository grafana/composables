# RabbitMQ Message Queue Service for Development
# Provides RabbitMQ message queue with management UI
# Used by OnCall backend for Celery task queue

services:
  rabbitmq:
    # Overridable so a consumer can develop against a broker version other than the default,
    # e.g. testing a 3.x -> 4.x upgrade before committing to it. Note that RabbitMQ will not boot
    # on a data directory written by a different major version, so remove the rabbitmq-data volume
    # when changing this.
    image: rabbitmq:${RABBITMQ_IMAGE_TAG:-3-management}
    user: root
    command: >
      sh -c "chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
             gosu rabbitmq docker-entrypoint.sh rabbitmq-server"
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      # Set Erlang cookie via env var to avoid Podman volume permissions issues
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-irm-local-dev-cookie}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
