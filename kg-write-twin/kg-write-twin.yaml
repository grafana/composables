services:
  kg-write-twin:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: kg-write-twin:dev
    # The container always listens on 8030; only the published host port is
    # overridable via KG_WRITE_TWIN_PORT (defaults to 8030 standalone).
    # Orchestrators that embed this composable (e.g. gamma's cc/up) publish it on
    # a non-conflicting host port, while in-network clients always reach it at
    # kg-write-twin:8030.
    ports:
      - "${KG_WRITE_TWIN_PORT:-8030}:8030"
    environment:
      PORT: "8030"
      BASE_PATH: /api-server
    # Healthcheck is defined in the Dockerfile (HEALTHCHECK) using a static
    # httpcheck binary, since the distroless image has no shell/curl. It probes
    # GET /api-server/_control/healthz.
